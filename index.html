<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniFix AI</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --panel-bg: #111827;
            --card-bg: #1f2937;
            --accent: #2563eb;
            --accent-green: #10b981;
            --text: #f9fafb;
            --muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text);
            overflow: hidden;
        }

        /* الهيكل الرئيسي */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* القائمة الجانبية */
        #sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: fixed;
            top: 0;
            right: -280px;
            height: 100%;
            transition: right 0.3s ease;
            z-index: 9999;
            border-left: 1px solid rgba(255,255,255,0.08);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        #sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-sidebar-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            pointer-events: auto;
        }

        .btn-new-chat {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            pointer-events: auto;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            padding: 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .chat-item.active {
            border: 1px solid var(--accent);
            background: rgba(37, 99, 235, 0.15);
        }

        .chat-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .delete-chat-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            pointer-events: auto;
        }

        /* الشريط العلوي */
        header {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            background: var(--panel-bg);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
            z-index: 100;
        }

        .plan-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            pointer-events: auto;
        }

        .plan-badge .title {
            color: #34d399;
            font-size: 12px;
            font-weight: bold;
        }

        .plan-badge .timer {
            color: #a7f3d0;
            font-size: 10px;
            font-weight: bold;
        }

        header h1 {
            font-size: 18px;
            color: #3b82f6;
            font-weight: bold;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 26px;
            cursor: pointer;
            padding: 8px;
            pointer-events: auto;
        }

        /* منطقة عرض الرسائل */
        #display-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1;
        }

        .welcome-card {
            text-align: center;
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 30px 20px;
            border-radius: 16px;
            max-width: 380px;
            margin: auto;
            width: 90%;
        }

        .welcome-card h2 {
            font-size: 24px;
            color: #3b82f6;
            margin-bottom: 10px;
        }

        .welcome-card p {
            color: var(--muted);
            font-size: 13px;
        }

        .user-bubble {
            align-self: flex-start;
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 10px 14px;
            max-width: 85%;
            font-size: 14px;
        }

        .media-grid {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .media-grid img, .media-grid video {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
        }

        .ai-bubble {
            width: 100%;
            color: #f3f4f6;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* شريط الإدخال الرئيسي المضمون */
        .input-container {
            flex-shrink: 0;
            background: var(--panel-bg);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 500;
            pointer-events: auto;
        }

        .media-preview-bar {
            display: none;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .media-preview-bar .thumb-box {
            position: relative;
            flex-shrink: 0;
        }

        .media-preview-bar img, .media-preview-bar video {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--accent);
        }

        .media-preview-bar .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            pointer-events: auto;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-dark);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 2px 10px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 10px 4px;
            outline: none;
            font-size: 15px;
            pointer-events: auto;
        }

        .add-btn {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 30px;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            pointer-events: auto;
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            pointer-events: auto;
        }

        /* نافذة الباقات */
        #plan-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }

        .plans-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .plan-card-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-info .title {
            font-weight: bold;
            font-size: 13px;
        }

        .plan-info .meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            gap: 10px;
        }

        .ad-btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            pointer-events: auto;
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <span style="font-weight: bold;">المحادثات</span>
            <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="btn-new-chat" onclick="createNewChat()">+ محادثة جديدة</button>
        <div class="chat-list" id="chat-list"></div>
    </div>

    <div id="app-container">
        <header>
            <div class="plan-badge" onclick="openPlans()">
                <div class="title" id="active-plan-title">الباقة العادية</div>
                <div class="timer" id="plan-timer-text">(غير مفعلة)</div>
            </div>
            <h1>OmniFix AI</h1>
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        </header>

        <div id="display-area">
            <div class="welcome-card" id="welcome-card">
                <h2>OmniFix AI</h2>
                <p>المساعد الذكي المتكامل للدردشة والنصوص والوسائط.</p>
            </div>
        </div>

        <div class="input-container">
            <div class="media-preview-bar" id="media-preview-bar"></div>

            <div class="input-box">
                <input type="file" id="media-file" accept="image/*,video/*" multiple style="display:none" onchange="handleFilesSelected(event)">
                <button class="add-btn" type="button" onclick="triggerFileSelect()">+</button>
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
                </div>
                <button class="send-btn" type="button" onclick="sendRequest()">إرسال</button>
            </div>
        </div>
    </div>

    <div id="plan-modal">
        <div class="modal-content">
            <div class="modal-header">قائمة الباقات والترقيات</div>
            <div class="plans-scroll" id="plans-container"></div>
            <button class="close-btn" onclick="closePlans()">إغلاق</button>
        </div>
    </div>

    <script>
        let chats = [];
        let adCounts = {};
        let activePlanInfo = null;
        let currentChatId = null;
        let selectedFiles = [];
        let timerInterval = null;

        const planNames = [
            "الأساسية", "الذكاء السريع", "الذكاء المتقدم", "الذكاء الفائق", "المحترف", 
            "الاحترافية", "المبتكر", "المطور", "الخبير", "العملاق",
            "المطورة Max", "Super AI", "Ultra Speed", "Mega AI", "Turbo Fast",
            "Omni16 Pro", "Omni17 Ultra", "Omni18 Master", "Omni19 Elite", "Omni20 Prime",
            "Omni21 Plus", "Omni22 Max", "Omni23 Turbo", "Omni24 Hyper", "Omni25 Ultimate",
            "Omni26 Max", "Omni27 Max", "Omni28 Ultra", "باقة الذكاء الخارق", "باقة VIP الاحترافية"
        ];

        window.addEventListener('DOMContentLoaded', () => {
            try { chats = JSON.parse(localStorage.getItem('omnifix_chats')) || []; } catch(e) { chats = []; }
            try { adCounts = JSON.parse(localStorage.getItem('omnifix_ad_counts')) || {}; } catch(e) { adCounts = {}; }
            try { activePlanInfo = JSON.parse(localStorage.getItem('omnifix_active_plan')) || null; } catch(e) { activePlanInfo = null; }

            renderPlansList();
            renderSidebar();
            initActivePlan();

            if (chats.length > 0) {
                loadChat(chats[0].id);
            }
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        }

        function openPlans() {
            document.getElementById('plan-modal').style.display = 'flex';
        }

        function closePlans() {
            document.getElementById('plan-modal').style.display = 'none';
        }

        function renderPlansList() {
            const container = document.getElementById('plans-container');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const name = `باقة ${i}: ${planNames[i-1]}`;
                const currentCount = adCounts[i] || 0;
                
                const card = document.createElement('div');
                card.className = 'plan-card-item';
                card.innerHTML = `
                    <div class="plan-info">
                        <div class="title">${name}</div>
                        <div class="meta">
                            <span>⏱️ 12 ساعة</span>
                            <span>📺 ${i} إعلان</span>
                        </div>
                    </div>
                    <button class="ad-btn" onclick="watchAd(${i}, '${name}')">مشاهدة (${currentCount}/${i})</button>
                `;
                container.appendChild(card);
            }
        }

        function watchAd(planIndex, planTitle) {
            let count = adCounts[planIndex] || 0;
            count++;
            adCounts[planIndex] = count;
            localStorage.setItem('omnifix_ad_counts', JSON.stringify(adCounts));

            if (count >= planIndex) {
                adCounts[planIndex] = 0;
                localStorage.setItem('omnifix_ad_counts', JSON.stringify(adCounts));
                
                const expireTime = Date.now() + (12 * 60 * 60 * 1000);
                activePlanInfo = { name: planTitle, expireTime: expireTime };
                localStorage.setItem('omnifix_active_plan', JSON.stringify(activePlanInfo));
                
                alert(`تم تفعيل ${planTitle} بنجاح لمدة 12 ساعة!`);
                initActivePlan();
                closePlans();
            } else {
                alert(`تمت مشاهدة إعلان (${count}/${planIndex}). متبقي ${planIndex - count} إعلان لتفعيل الباقة.`);
            }
            renderPlansList();
        }

        function initActivePlan() {
            if (timerInterval) clearInterval(timerInterval);

            if (activePlanInfo && activePlanInfo.expireTime && activePlanInfo.expireTime > Date.now()) {
                document.getElementById('active-plan-title').innerText = activePlanInfo.name;
                updateTimerDisplay();
                timerInterval = setInterval(updateTimerDisplay, 1000);
            } else {
                document.getElementById('active-plan-title').innerText = 'الباقة العادية';
                document.getElementById('plan-timer-text').innerText = '(غير مفعلة)';
            }
        }

        function updateTimerDisplay() {
            if (!activePlanInfo || !activePlanInfo.expireTime) return;
            const now = Date.now();
            const diff = activePlanInfo.expireTime - now;

            if (diff <= 0) {
                clearInterval(timerInterval);
                activePlanInfo = null;
                localStorage.removeItem('omnifix_active_plan');
                document.getElementById('active-plan-title').innerText = 'الباقة العادية';
                document.getElementById('plan-timer-text').innerText = '(انتهت الباقة)';
                return;
            }

            const hrs = Math.floor(diff / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            const pad = (n) => n < 10 ? '0' + n : n;
            document.getElementById('plan-timer-text').innerText = `(${pad(hrs)}:${pad(mins)}:${pad(secs)}) مفعلة`;
        }

        function triggerFileSelect() {
            document.getElementById('media-file').click();
        }

        function handleFilesSelected(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                const isVideo = file.type.startsWith('video/');
                reader.onload = function(e) {
                    selectedFiles.push({ src: e.target.result, type: isVideo ? 'video' : 'image' });
                    renderPreviewThumbs();
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function renderPreviewThumbs() {
            const bar = document.getElementById('media-preview-bar');
            if (selectedFiles.length === 0) {
                bar.style.display = 'none';
                return;
            }
            bar.style.display = 'flex';
            bar.innerHTML = '';
            selectedFiles.forEach((item, idx) => {
                const box = document.createElement('div');
                box.className = 'thumb-box';
                if (item.type === 'video') {
                    box.innerHTML = `<video src="${item
