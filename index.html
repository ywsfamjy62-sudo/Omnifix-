<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniFix AI</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --panel-bg: #111827;
            --card-bg: #1f2937;
            --accent: #2563eb;
            --accent-green: #10b981;
            --text: #f9fafb;
            --muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* القائمة الجانبية */
        #sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: fixed;
            top: 0;
            right: -280px;
            height: 100%;
            transition: 0.3s ease;
            z-index: 100;
            border-left: 1px solid rgba(255,255,255,0.05);
        }

        #sidebar.open {
            right: 0;
        }

        .btn-new-chat {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            padding: 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid transparent;
        }

        .chat-item.active {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.1);
        }

        /* الواجهة الرئيسية */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--panel-bg);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .plan-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .plan-badge .title {
            color: #34d399;
            font-size: 13px;
            font-weight: bold;
        }

        .plan-badge .timer {
            color: #a7f3d0;
            font-size: 11px;
            margin-top: 2px;
        }

        header h1 {
            font-size: 20px;
            color: #3b82f6;
            font-weight: bold;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
        }

        #display-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-card {
            text-align: center;
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 35px 25px;
            border-radius: 16px;
            max-width: 400px;
            margin: auto;
            width: 90%;
        }

        .welcome-card h2 {
            font-size: 26px;
            color: #3b82f6;
            margin-bottom: 12px;
        }

        .welcome-card p {
            color: var(--muted);
            font-size: 14px;
        }

        /* فقاعات الحوار والردود */
        .user-question-bubble {
            align-self: flex-start;
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid var(--accent);
            border-radius: 14px;
            padding: 12px 18px;
            max-width: 85%;
            color: #ffffff;
            font-size: 15px;
        }

        .user-question-images {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .user-question-images img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .ai-full-response {
            width: 100%;
            color: #f3f4f6;
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 10px 5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* شريط الكتابة والصور المرفقة */
        .input-container {
            padding: 10px 16px 16px 16px;
            background: var(--panel-bg);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .media-preview-bar {
            display: none;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .media-preview-bar .thumb-box {
            position: relative;
            flex-shrink: 0;
        }

        .media-preview-bar img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--accent);
        }

        .media-preview-bar .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-dark);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 4px 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px 5px;
            outline: none;
            font-size: 15px;
        }

        .add-btn {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 24px;
            cursor: pointer;
            padding: 0 5px;
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        /* نافذة الباقات 30 */
        #plan-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--panel-bg);
            border-radius: 16px;
            width: 92%;
            max-width: 440px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .plans-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .plan-card-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-info .title {
            font-weight: bold;
            font-size: 14px;
        }

        .plan-info .meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            display: flex;
            gap: 12px;
        }

        .ad-btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="btn-new-chat" id="new-chat-btn">+ محادثة جديدة</button>
        <div class="chat-list" id="chat-list"></div>
    </div>

    <div id="main-content">
        <header>
            <div class="plan-badge" id="open-plans-btn">
                <div class="title" id="active-plan-title">الباقة العادية</div>
                <div class="timer">(11:59:59) مفعلة</div>
            </div>
            <h1>OmniFix AI</h1>
            <button class="menu-btn" id="menu-btn">☰</button>
        </header>

        <div id="display-area">
            <div class="welcome-card" id="welcome-card">
                <h2>OmniFix AI</h2>
                <p>المساعد الذكي المتكامل للدردشة والنصوص والوسائط.</p>
            </div>
        </div>

        <div class="input-container">
            <div class="media-preview-bar" id="media-preview-bar"></div>

            <div class="input-box">
                <input type="file" id="media-file" accept="image/*" multiple style="display:none">
                <button class="add-btn" id="add-file-btn">+</button>
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="اكتب رسالتك هنا...">
                </div>
                <button class="send-btn" id="send-btn">إرسال</button>
            </div>
        </div>
    </div>

    <div id="plan-modal">
        <div class="modal-content">
            <div class="modal-header">قائمة الباقات والترقيات</div>
            <div class="plans-scroll" id="plans-container"></div>
            <button class="close-btn" id="close-plans-btn">إغلاق</button>
        </div>
    </div>

    <script>
        let chats = JSON.parse(localStorage.getItem('omnifix_chats') || '[]');
        let currentChatId = null;
        let selectedFiles = [];

        const planNames = [
            "الأساسية", "الذكاء السريع", "الذكاء المتقدم", "الذكاء الفائق", "المحترف", 
            "الاحترافية", "المبتكر", "المطور", "الخبير", "العملاق",
            "المطورة Max", "Super AI", "Ultra Speed", "Mega AI", "Turbo Fast",
            "Omni16 Pro", "Omni17 Ultra", "Omni18 Master", "Omni19 Elite", "Omni20 Prime",
            "Omni21 Plus", "Omni22 Max", "Omni23 Turbo", "Omni24 Hyper", "Omni25 Ultimate",
            "Omni26 Max", "Omni27 Max", "Omni28 Ultra", "باقة الذكاء الخارق", "باقة VIP الاحترافية"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderPlans();

            document.getElementById('menu-btn').onclick = toggleSidebar;
            document.getElementById('new-chat-btn').onclick = createNewChat;
            document.getElementById('open-plans-btn').onclick = openPlans;
            document.getElementById('close-plans-btn').onclick = closePlans;
            document.getElementById('add-file-btn').onclick = () => document.getElementById('media-file').click();
            document.getElementById('media-file').onchange = onFilesSelected;
            document.getElementById('send-btn').onclick = sendRequest;
            document.getElementById('user-input').onkeypress = (e) => { if (e.key === 'Enter') sendRequest(); };

            if (chats.length > 0) {
                loadChat(chats[0].id);
            } else {
                renderSidebar();
            }
        });

        function renderPlans() {
            const container = document.getElementById('plans-container');
            container.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const name = `باقة ${i}: ${planNames[i-1]}`;
                const card = document.createElement('div');
                card.className = 'plan-card-item';
                card.innerHTML = `
                    <div class="plan-info">
                        <div class="title">${name}</div>
                        <div class="meta">
                            <span>⏱️ 12 ساعة</span>
                            <span>📺 ${i} إعلان</span>
                        </div>
                    </div>
                    <button class="ad-btn" onclick="watchAd('${name}', ${i})">مشاهدة (0/${i})</button>
                `;
                container.appendChild(card);
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function openPlans() { document.getElementById('plan-modal').style.display = 'flex'; }
        function closePlans() { document.getElementById('plan-modal').style.display = 'none'; }

        function watchAd(planTitle, count) {
            alert(`سيتم فتح الإعلان (${count}). عند إكماله ستتفعل ${planTitle} لمدة 12 ساعة.`);
            document.getElementById('active-plan-title').innerText = planTitle;
            closePlans();
        }

        function onFilesSelected(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedFiles.push(event.target.result);
                    renderPreviewThumbs();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderPreviewThumbs() {
            const bar = document.getElementById('media-preview-bar');
            if (selectedFiles.length === 0) {
                bar.style.display = 'none';
                return;
            }
            bar.style.display = 'flex';
            bar.innerHTML = '';
            selectedFiles.forEach((src, idx) => {
                const box = document.createElement('div');
                box.className = 'thumb-box';
                box.innerHTML = `
                    <img src="${src}">
                    <button class="remove-btn" onclick="removeThumb(${idx})">×</button>
                `;
                bar.appendChild(box);
            });
        }

        function removeThumb(idx) {
            selectedFiles.splice(idx, 1);
            renderPreviewThumbs();
        }

        function createNewChat() {
            currentChatId = Date.now().toString();
            chats.unshift({ id: currentChatId, title: 'محادثة جديدة', history: [] });
            saveChats();
            renderSidebar();
            showWelcome();
            if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
        }

        function saveChats() { localStorage.setItem('omnifix_chats', JSON.stringify(chats)); }

        function renderSidebar() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerText = chat.title;
                item.onclick = () => loadChat(chat.id);
                list.appendChild(item);
            });
        }

        function loadChat(id) {
            currentChatId = id;
            renderSidebar();
            const chat = chats.find(c => c.id === id);
            if (!chat || chat.history.length === 0) {
                showWelcome();
            } else {
                renderFullChat(chat);
            }
            if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
        }

        function showWelcome() {
            document.getElementById('display-area').innerHTML = `
                <div class="welcome-card">
                    <h2>OmniFix AI</h2>
                    <p>المساعد الذكي المتكامل للدردشة والنصوص والوسائط.</p>
                </div>
            `;
        }

        function renderFullChat(chat) {
            const area = document.getElementById('display-area');
            area.innerHTML = '';

            chat.history.forEach(item => {
                if (item.role === 'user') {
                    const qBubble = document.createElement('div');
                    qBubble.className = 'user-question-bubble';
                    qBubble.innerText = item.text;

                    if (item.images && item.images.length > 0) {
                        const imgBox = document.createElement('div');
                        imgBox.className = 'user-question-images';
                        item.images.forEach(imgSrc => {
                            imgBox.innerHTML += `<img src="${imgSrc}">`;
                        });
                        qBubble.appendChild(imgBox);
                    }
                    area.appendChild(qBubble);
                } else {
                    const aiResp = document.createElement('div');
                    aiResp.className = 'ai-full-response';
                    aiResp.innerText = item.text;
                    area.appendChild(aiResp);
                }
            });

            area.scrollTop = area.scrollHeight;
        }

        async function sendRequest() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && selectedFiles.length === 0) return;

            if (!currentChatId) {
                currentChatId = Date.now().toString();
                chats.unshift({ id: currentChatId, title: text || 'محادثة جديدة', history: [] });
            }

            const currentChat = chats.find(c => c.id === currentChatId);
            if (currentChat.history.length === 0 && text) {
                currentChat.title = text.substring(0, 25);
            }

            const currentImages = [...selectedFiles];

            currentChat.history.push({ role: 'user', text: text, images: currentImages });
            currentChat.history.push({ role: 'ai', text: 'جاري التفكير...' });

            saveChats();
            renderSidebar();
            renderFullChat(currentChat);

            input.value = '';
            selectedFiles = [];
            renderPreviewThumbs();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, images: currentImages })
                });
                const data = await response.json();
                
                currentChat.history[currentChat.history.length - 1].text = dat
