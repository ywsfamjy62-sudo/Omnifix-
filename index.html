<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniFix AI</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --card-bg: #1f2937;
            --accent: #2563eb;
            --accent-green: #10b981;
            --text: #ffffff;
            --muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 60px;
            background: var(--panel-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 14px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .plan-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            padding: 5px 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            min-width: 110px;
        }

        .plan-badge .title { color: #34d399; font-size: 11px; font-weight: bold; }
        .plan-badge .subtitle { color: #a7f3d0; font-size: 9px; direction: ltr; }

        .app-title { font-size: 18px; font-weight: bold; color: #3b82f6; }
        .menu-icon { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        /* منطقة المحادثة التفاعلية مع دعم التمرير الممتاز */
        #display-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .welcome-card {
            margin: auto;
            text-align: center;
            background: rgba(31, 41, 55, 0.5);
            padding: 25px 15px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            width: 90%;
            max-width: 360px;
        }

        .welcome-card h2 { font-size: 22px; color: #3b82f6; margin-bottom: 8px; }
        .welcome-card p { font-size: 13px; color: var(--muted); }

        .msg-user {
            background: rgba(37, 99, 235, 0.25);
            border: 1px solid var(--accent);
            padding: 10px 14px;
            border-radius: 12px 12px 2px 12px;
            align-self: flex-start;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg-ai {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 14px;
            border-radius: 12px 12px 12px 2px;
            align-self: flex-end;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
            color: #e5e7eb;
            word-break: break-word;
        }

        /* شريط الإدخال المرفوع والتجاوبي */
        .input-container {
            background: var(--panel-bg);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 10px 12px 20px 12px;
            flex-shrink: 0;
        }

        .input-box { display: flex; align-items: center; gap: 8px; }

        .input-wrapper {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 8px;
        }

        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 8px;
            outline: none;
            font-size: 14px;
        }

        .add-btn { background: none; border: none; color: #3b82f6; font-size: 24px; cursor: pointer; }
        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        #sidebar {
            position: fixed;
            top: 0; right: -280px;
            width: 280px; height: 100%;
            background: var(--panel-bg);
            z-index: 9999;
            transition: 0.3s ease;
            padding: 20px;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
        }
        #sidebar.open { right: 0; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3>المحادثات</h3>
            <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
        </div>
        <button onclick="newChat()" style="width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; font-weight:bold;">+ محادثة جديدة</button>
    </div>

    <header>
        <div class="plan-badge">
            <div class="title" id="active-plan-title">الباقة العادية</div>
            <div class="subtitle" id="active-plan-timer">(نشطة)</div>
        </div>
        <div class="app-title">OmniFix AI</div>
        <button class="menu-icon" onclick="toggleSidebar()">☰</button>
    </header>

    <div id="display-area">
        <div class="welcome-card" id="welcomeCard">
            <h2>OmniFix AI</h2>
            <p>المساعد الذكي المتكامل للدردشة والنصوص والوسائط.</p>
        </div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="add-btn" onclick="document.getElementById('fileInput').click()">+</button>
                <input type="file" id="fileInput" accept="image/*,video/*" style="display:none">
            </div>
        </div>
    </div>

    <script>
        let chatHistory = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const area = document.getElementById('display-area');
            const welcomeCard = document.getElementById('welcomeCard');
            if (welcomeCard) welcomeCard.remove();

            // عرض رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'msg-user';
            userMsg.innerText = text;
            area.appendChild(userMsg);

            input.value = '';
            scrollToBottom();

            // إضافة الرسالة لسجل المحادثة
            chatHistory.push({ role: "user", content: text });

            // إنشاء عنصر إجابة الذكاء الاصطناعي
            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg-ai';
            aiMsg.innerText = 'جاري التفكير...';
            area.appendChild(aiMsg);
            scrollToBottom();

            try {
                // الاتصال بـ Backend API الموجود في Vercel
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await response.json();

                if (response.ok && data.reply) {
                    aiMsg.innerText = data.reply;
                    chatHistory.push({ role: "assistant", content: data.reply });
                } else {
                    aiMsg.innerText = 'حدث خطأ أثناء الاتصال بالخادم: ' + (data.error || 'يرجى التثبت من الـ API Key');
                }
            } catch (err) {
                aiMsg.innerText = 'خطأ في الاتصال بالشبكة.';
            }

            scrollToBottom();
        }

        function scrollToBottom() {
            const area = document.getElementById('display-area');
            area.scrollTop = area.scrollHeight;
        }

        function newChat() {
            chatHistory = [];
            document.getElementById('display-area').innerHTML = `
                <div class="welcome-card" id="welcomeCard">
                    <h2>OmniFix AI</h2>
                    <p>المساعد الذكي المتكامل للدردشة والنصوص والوسائط.</p>
                </div>
            `;
            toggleSidebar();
        }
    </script>
</body>
</html>
