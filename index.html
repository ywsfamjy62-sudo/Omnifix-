<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFix AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #161b22;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      color: #58a6ff;
    }
    .badge {
      background-color: #21262d;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      border: 1px solid #30363d;
    }
    #chat-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user-message {
      background-color: #1f6feb;
      color: #ffffff;
      align-self: flex-start;
      border-bottom-right-radius: 2px;
    }
    .bot-message {
      background-color: #21262d;
      color: #c9d1d9;
      align-self: flex-end;
      border-bottom-left-radius: 2px;
      border: 1px solid #30363d;
    }
    .input-container {
      padding: 15px;
      background-color: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background-color: #0d1117;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #58a6ff;
    }
    button {
      padding: 12px 24px;
      background-color: #238636;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #2ea043;
    }
    button:disabled {
      background-color: #343942;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">OmniFix AI</div>
    <div class="badge">الباقة العادية</div>
  </header>

  <div id="chat-container"></div>

  <div class="input-container">
    <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
    <button id="send-btn" onclick="sendMessage()">إرسال</button>
  </div>

  <script>
    async function sendMessage() {
      const inputElement = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const message = inputElement.value.trim();

      if (!message) return;

      // 1. عرض رسالة المستخدم
      appendMessage(message, 'user-message');
      inputElement.value = '';
      inputElement.disabled = true;
      sendBtn.disabled = true;

      // 2. إظهار حالة "جاري التفكير..."
      const loadingId = appendMessage('جاري الاتصال بالسيرفر...', 'bot-message');

      try {
        // 3. إرسال الطلب إلى مسار API الخاص بـ Vercel
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        
        // 4. تحديث الرسالة بالرد القادم من الـ API
        const loadingElement = document.getElementById(loadingId);
        if (loadingElement) {
          loadingElement.textContent = data.reply || data.error || 'تم استلام الرد بنجاح.';
        }
      } catch (error) {
        const loadingElement = document.getElementById(loadingId);
        if (loadingElement) {
          loadingElement.textContent = 'حدث خطأ في الاتصال بالسيرفر. يرجى المحاولة لاحقاً.';
        }
      } finally {
        inputElement.disabled = false;
        sendBtn.disabled = false;
        inputElement.focus();
      }
    }

    function appendMessage(text, className) {
      const chatContainer = document.getElementById('chat-container');
      const messageDiv = document.createElement('div');
      const messageId = 'msg-' + Date.now();
      messageDiv.id = messageId;
      messageDiv.className = `message ${className}`;
      messageDiv.textContent = text;
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return messageId;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }
  </script>
</body>
</html>
