<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniFix AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0a0f1d; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 60px; background: #111827; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid #374151; }
        .btn-header { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; }
        
        #display-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .welcome { text-align: center; margin: auto; background: #1f2937; padding: 20px; border-radius: 12px; }
        
        .input-bar { background: #111827; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #374151; }
        .input-bar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #0a0f1d; color: white; outline: none; }
        .input-bar button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        #sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #111827; z-index: 999; transition: 0.3s; padding: 20px; box-shadow: -2px 0 10px rgba(0,0,0,0.5); }
        #sidebar.open { right: 0; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>المحادثات</h3>
        <br>
        <button class="btn-header" onclick="closeMenu()">إغلاق القائمة</button>
    </div>

    <header>
        <button class="btn-header" onclick="alert('تم النقر على الباقات!')">الباقات</button>
        <h2>OmniFix AI</h2>
        <button class="btn-header" onclick="openMenu()">☰ القائمة</button>
    </header>

    <div id="display-area">
        <div class="welcome">
            <h3>مرحباً بك في OmniFix AI</h3>
            <p>أكتب رسالتك في الأسفل للتجربة</p>
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="اكتب هنا...">
        <button onclick="sendMsg()">إرسال</button>
    </div>

    <script>
        function openMenu() {
            document.getElementById('sidebar').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('sidebar').classList.remove('open');
        }
        function sendMsg() {
            const inp = document.getElementById('userInput');
            if(!inp.value) return;
            const area = document.getElementById('display-area');
            area.innerHTML += `<div style="background:#2563eb; padding:10px; border-radius:8px; align-self:flex-start;">${inp.value}</div>`;
            inp.value = '';
        }
    </script>
</body>
</html>
